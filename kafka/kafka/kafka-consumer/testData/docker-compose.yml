services:
  # =========================
  # Kafka Consumer
  # =========================
  kafka-consumer:
    image: kafka-consumer:1.0
    build:
      context: ./../
      dockerfile: Dockerfile
    container_name: kafka-consumer
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - broker-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  broker-network:
    external: true
    