apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app: {{ .Release.Name }}

    spec:
      containers:
        - name: node-red

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 1880
              protocol: TCP

          env:
            - name: TZ
              value: "Asia/Kolkata"

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            - name: node-red-data
              mountPath: /data

      volumes:
        - name: node-red-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-pvc