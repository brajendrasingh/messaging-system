replicaCount: 1

image:
  repository: kafka-producer
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

kafka:
  bootstrapServers: "kafka:9092"
  orderTopic: "orders"

resources:
  requests:
    cpu: 250m
    memory: 512Mi

  limits:
    cpu: 500m
    memory: 1Gi