services:
  # =========================
  # Node-RED
  # =========================
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - nodered-data:/data
    networks:
      - broker-network

  # =========================
  # Kafka Producer
  # =========================
  kafka-producer:
    #image: kafka-producer:0.0.1-SNAPSHOT
    build:
      context: ./kafka-producer
      dockerfile: Dockerfile
    container_name: kafka-producer
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - broker-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  nodered-data:

networks:
  broker-network:
    external: true
    