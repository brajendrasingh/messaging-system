services:
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - nodered-data:/data
    networks:
      - broker-network

volumes:
  nodered-data:

networks:
  broker-network:
    external: true
    