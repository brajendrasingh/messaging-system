services:
  # =========================
  # Kafka Stream
  # =========================
  kafka-stream:
    image: kafka-stream:1.0
    build:
      context: ./../
      dockerfile: Dockerfile
    container_name: kafka-stream
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - broker-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  broker-network:
    external: true
    